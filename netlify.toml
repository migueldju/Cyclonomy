# Web de Cyclonomy (cyclonomy.app): exportación estática de la app de Expo
[build]
  base = "app"
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Los ficheros con huella en el nombre no cambian nunca: caché larga
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fuentes e imágenes: también llevan huella en el nombre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# La app habla con Supabase nada más arrancar: se abre la conexión mientras se descarga el código
[[headers]]
  for = "/*"
  [headers.values]
    Link = "<https://yjevkuhcrrumtwaonrqv.supabase.co>; rel=preconnect"

# Cualquier ruta (/join/CÓDIGO, /auth/callback…) la resuelve la app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
